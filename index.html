<style>
:root{
  --paper:#fafaf9; --card:#ffffff; --ink:#1c1917; --muted:#57534e; --faint:#a8a29e;
  --line:#d6d3d1; --line2:#e7e5e4;
  --teal:#0f766e; --teal-d:#115e59; --teal-bg:#f0fdfa; --teal-100:#ccfbf1; --teal-b:#5eead4;
  --em:#047857; --em-bg:#ecfdf5; --em-b:#6ee7b7;
  --am:#b45309; --am-bg:#fffbeb; --am-b:#fcd34d;
  --ro:#e11d48; --ro-bg:#fff1f2; --ro-b:#fda4af;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --mono:ui-monospace,Menlo,Consolas,'Courier New',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
header{margin-bottom:20px}
.tagline{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.02em}
.warn{margin:0 0 16px;padding:8px 12px;background:var(--am-bg);border:1px solid var(--am-b);color:var(--am);font-family:var(--mono);font-size:12px}
/* brand + cells */
.brand{display:inline-flex;gap:2px}
.cells{display:inline-flex;flex-wrap:wrap;gap:2px;align-items:center;vertical-align:middle}
.cell{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:18px;border:1px solid #292524;background:#fff;color:#1c1917}
.cell.accent{border-color:var(--teal-d);background:var(--teal-bg);color:var(--teal-d)}
.cell.gap{border:none;width:12px}
.cell.dash{border:none;width:10px;position:relative}
.cell.dash::after{content:"";position:absolute;top:50%;left:2px;right:2px;height:1px;background:var(--faint)}
.cells.small .cell{width:24px;height:24px;font-size:12px}
/* nav */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:18px}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;margin-bottom:-1px;font-family:var(--mono);font-size:14px;color:var(--muted);cursor:pointer}
.tab.active{color:var(--ink);border-bottom-color:var(--teal)}
/* buttons */
.btn{font-family:var(--mono);font-size:13px;padding:7px 13px;border:1px solid transparent;cursor:pointer;background:#fff;display:inline-flex;align-items:center;gap:6px;line-height:1}
.btn-dark{background:#1c1917;color:#fafaf9;border-color:#1c1917}
.btn-dark:hover{background:#44403c}
.btn-teal{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-teal:hover{background:var(--teal-d)}
.btn-line{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-line:hover{border-color:#1c1917}
.btn-ghost{background:#fff;border:1px dashed var(--line);color:var(--teal-d)}
.btn-ghost:hover{border-color:var(--teal-b)}
.btn-em{background:#fff;border-color:var(--em-b);color:var(--em)}
.btn-em:hover{background:var(--em-bg)}
.btn-am{background:#fff;border-color:var(--am-b);color:var(--am)}
.btn-am:hover{background:var(--am-bg)}
.btn-x{background:none;border:none;color:var(--faint);font-family:var(--mono);font-size:12px;cursor:pointer;padding:4px 0}
.btn-x:hover{color:var(--ro)}
.linkbtn{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:12px;cursor:pointer}
.linkbtn:hover{color:var(--ink)}
/* chips */
.chip{font-family:var(--mono);font-size:12px;padding:5px 10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.chip:hover{border-color:#1c1917}
.chip.active{background:#1c1917;color:#fafaf9;border-color:#1c1917}
.chip.teal{color:var(--teal-d);border-color:var(--line)}
.chip.teal:hover{border-color:var(--teal-b)}
.chip.activeteal{background:var(--teal);color:#fff;border-color:var(--teal)}
/* layout helpers */
.row{display:flex;align-items:center}
.row.gap{gap:8px}.row.gap2{gap:12px}
.row.wrap{flex-wrap:wrap}
.row.center{justify-content:center}
.row.between{justify-content:space-between}
.mb{margin-bottom:14px}.mb2{margin-bottom:20px}.mt{margin-top:10px}.pad{padding:0 20px 20px}
.grow{flex:1}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.sm{font-size:12px}.mono{font-family:var(--mono)}.serif{font-family:var(--serif)}
.em{color:var(--em)}.am{color:var(--am)}.ro{color:var(--ro)}
/* card */
.card{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card-head{padding:20px 20px 16px;border-bottom:1px solid var(--line2)}
.chiprow{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:24px}
.devchip{font-family:var(--mono);font-size:12px;padding:2px 8px;background:#f5f5f4;border:1px solid var(--line2);color:var(--muted)}
.devchip.dash{background:#fff;border:1px dashed var(--line);color:var(--faint);cursor:pointer}
.devchip.dash:hover{color:var(--teal-d);border-color:var(--teal-b)}
.devblurb{font-family:var(--mono);font-size:12px;color:var(--faint)}
.cluetext{font-family:var(--serif);font-size:24px;line-height:1.35;margin:0}
.hl{background:var(--teal-100);border-radius:2px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.card-body{padding:20px}
.row2{display:flex;gap:8px}
.answer{flex:1;padding:8px 12px;font-family:var(--mono);font-size:14px;border:1px solid var(--line);outline:none}
.answer:focus{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.answer.bad{border-color:var(--ro-b);box-shadow:0 0 0 1px var(--ro-b)}
.msg-inline{font-family:var(--mono);font-size:12px;margin-top:8px;min-height:16px}
.msg-inline.bad{color:var(--ro)}
.lbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:0 0 4px}
.lbl.center{text-align:center}.lbl.em{color:var(--em)}.lbl.ro{color:var(--ro)}
.defn{font-family:var(--serif);font-size:18px;color:#292524;margin-bottom:16px}
.parse{font-family:var(--mono);font-size:13px;color:#44403c;line-height:1.6;margin-bottom:18px}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:18px}
.badge{font-family:var(--mono);font-size:12px;padding:4px 10px;border:1px solid}
.badge.clean{color:var(--em);border-color:var(--em-b);background:var(--em-bg)}
.badge.partial{color:var(--am);border-color:var(--am-b);background:var(--am-bg)}
.badge.missed{color:var(--ro);border-color:var(--ro-b);background:var(--ro-bg)}
.foot{display:flex;align-items:center;gap:12px;margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.foot .linkbtn{margin-left:auto}
/* import panel */
.panel{background:#fff;border:1px solid var(--line);padding:16px;margin-bottom:20px}
.note{display:block;background:var(--teal-bg);border:1px solid var(--teal-b);color:#134e4a;font-family:var(--serif);font-size:14px;padding:8px 12px;margin-bottom:12px}
.pastebox{width:100%;padding:8px 12px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);outline:none;margin-bottom:8px}
.pastebox:focus{border-color:var(--teal)}
.msg{font-family:var(--mono);font-size:12px;margin-top:10px}
.msg.ok{color:var(--em)}.msg.err{color:var(--ro)}
/* indicators */
.indgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:620px){.indgrid{grid-template-columns:1fr}}
.indcard{background:#fff;border:1px solid var(--line);padding:11px 14px}
.indtop{display:flex;justify-content:space-between;align-items:flex-start}
.indterm{font-family:var(--mono);font-size:14px;font-weight:600}
.indmean{font-family:var(--mono);font-size:12px;color:var(--teal-d);margin-top:4px}
.indmean.big{font-size:15px}
.indnote{font-family:var(--serif);font-size:14px;color:var(--muted);margin-top:6px;line-height:1.35}
.ok{color:var(--em)}
.drill{padding:32px 20px;text-align:center}
.drillterm{font-family:var(--mono);font-size:24px;font-weight:600}
.drillrev{margin-top:20px;padding-top:20px;border-top:1px solid var(--line2)}
/* progress */
.stats{font-family:var(--mono);font-size:12px;color:var(--muted);gap:16px}
.stats b{color:var(--ink);font-size:16px}
.bar-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.bar-lbl{font-family:var(--mono);font-size:12px;color:var(--muted);width:96px;flex:none;text-align:right}
.bar-track{flex:1;height:16px;background:#f5f5f4;position:relative}
.bar-fill{position:absolute;left:0;top:0;bottom:0}
.bar-val{font-family:var(--mono);font-size:11px;color:var(--muted);width:36px;flex:none}
.empty{background:#fff;border:1px solid var(--line);padding:40px 20px;text-align:center;color:var(--muted);font-family:var(--serif)}
.btn.big{padding:11px 17px;font-size:15px}
.btn.full{width:100%;justify-content:center;margin-top:16px}
.answer{font-size:16px}
.drillans{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--teal-d);margin-bottom:10px}
@media(max-width:640px){
  .wrap{padding:16px 12px 48px}
  .cluetext{font-size:23px;line-height:1.3}
  .btn{padding:10px 14px}
  .btn.big{padding:14px 18px;font-size:16px}
  .answer{padding:13px 14px}
  .cell{width:31px;height:31px;font-size:15px}
  .tab{padding:11px 13px;font-size:15px}
  .chip{padding:8px 12px}
  .card-head{padding:18px 16px 14px}
  .card-body{padding:16px}
  .drillterm{font-size:26px}
}
#nextbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(250,250,249,.97);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#nextbar .badge{margin:0}
#nextbar #nextbtn{margin-left:auto}
.wrap{padding-bottom:96px}
html,body{height:100%}
body{position:fixed;inset:0;width:100%;overflow:hidden}
.wrap{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}

const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ============ storage ============ */
const LS={stats:"crib_stats",ind:"crib_ind",imp:"crib_imp"};
let storageOK=true;
function load(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){storageOK=false;return fb;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){storageOK=false;}}

if(!stats.assorted)stats.assorted={clean:0,partial:0,missed:0,seen:0};
if(!stats.assortedItems)stats.assortedItems={};

let imported=load(LS.imp,[]); if(!Array.isArray(imported))imported=[];
const persistStats=()=>save(LS.stats,stats);
const persistKnown=()=>save(LS.ind,known);
const persistImported=()=>save(LS.imp,imported);

/* ============ import parsing ============ */
function parseCSV(text){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===","){row.push(cur);cur="";}
      else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur="";}
      else if(c==="\r"){}else cur+=c;}}
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function parseImport(text){
  const out=[];const t=(text||"").trim();if(!t)return out;
  if(t[0]==="["||t[0]==="{"){
    try{const data=JSON.parse(t);let rows=[];
      if(Array.isArray(data))rows=data;
      else if(data&&Array.isArray(data.rows)){const cols=data.columns||[];rows=data.rows.map(r=>{const o={};cols.forEach((c,i)=>o[c]=r[i]);return o;});}
      for(const r of rows){if(!r||Array.isArray(r))continue;
        const clue=r.clue||r.Clue||r.CLUE,answer=r.answer||r.Answer||r.ANSWER,def=r.definition||r.Definition||"";
        if(clue&&answer)out.push({clue:String(clue),answer:String(answer),def:String(def||"")});}
      return out;
    }catch(e){}
  }
  const rows=parseCSV(t);if(!rows.length)return out;
  const header=rows[0].map(h=>h.trim().toLowerCase());
  let ci=header.indexOf("clue"),ai=header.indexOf("answer"),di=header.indexOf("definition"),start=1;
  if(ci<0||ai<0){ci=0;ai=1;di=2;start=0;}
  for(let i=start;i<rows.length;i++){const row=rows[i];
    const clue=(row[ci]||"").trim(),answer=(row[ai]||"").trim(),def=di>=0?(row[di]||"").trim():"";
    if(clue&&answer)out.push({clue,answer,def});}
  return out;
}

/* ============ selection ============ */
const cleanRate=d=>{const s=stats.devices[d];return(s&&s.seen)?s.clean/s.seen:null;};
const seenOf=id=>(P.deck==="learn"?(stats.items[id]&&stats.items[id].seen):(stats.assortedItems[id]&&stats.assortedItems[id].seen))||0;
function pick(){
  const pool=P.deck==="learn"?CLUES:assortedPool();
  const active=(P.deck==="learn"&&P.filter!=="all"&&P.filter!=="weak")?pool.filter(c=>c.device===P.filter):pool;
  const base=active.length?active:pool;
  const k=Math.min(E.recent.length,Math.max(0,base.length-1));
  const excl=new Set(k?E.recent.slice(-k):[]);
  const weight=c=>{let w=1;const seen=seenOf(c.id);
    if(P.deck==="learn"&&P.filter==="weak"){const cr=cleanRate(c.device);w=0.25+(1-(cr==null?0.5:cr))*2.2;}
    w+=seen===0?0.7:0.3/(seen+1);return Math.max(0.05,w);};
  const cands=base.filter(c=>!excl.has(c.id));
  const list=cands.length?cands:base;
  const total=list.reduce((s,c)=>s+weight(c),0);
  let r=Math.random()*total;
  for(const c of list){r-=weight(c);if(r<=0)return c;}
  return list[list.length-1];
}
function fresh(){
  E.current=pick();E.revealed=false;E.peeked=false;E.check=null;E.defHint=false;E.inputVal="";
  if(E.current)E.recent=E.recent.concat(E.current.id).slice(-12);
  populateCard();
}

/* ============ records ============ */
function recordLearn(c,r){
  const d=Object.assign({clean:0,partial:0,missed:0,seen:0},stats.devices[c.device]||{});d.seen++;d[r]++;stats.devices[c.device]=d;
  const it=Object.assign({seen:0},stats.items[c.id]||{});it.seen++;it.last=r;stats.items[c.id]=it;persistStats();
}
function recordAssorted(c,r){
  const a=Object.assign({clean:0,partial:0,missed:0,seen:0},stats.assorted||{});a.seen++;a[r]++;stats.assorted=a;
  const it=Object.assign({seen:0},stats.assortedItems[c.id]||{});it.seen++;stats.assortedItems[c.id]=it;persistStats();
}

function wireCard(){
  const inp=$("#panswer");
  if(inp){
    inp.addEventListener("focus",()=>{E.kbd=true;});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")doCheck();});
    inp.addEventListener("input",()=>{E.inputVal=inp.value;const m=$("#pmsg");if(m){m.textContent="";m.className="msg-inline";}inp.classList.remove("bad");});
  }
  $("#checkbtn").onclick=doCheck;
  $("#revealbtn").onclick=doReveal;
  $("#hintbtn").onclick=doHint;
  $("#nextbtn").onclick=nextCard;
}
function refocus(){const inp=$("#panswer");if(inp&&E.kbd){try{inp.focus({preventScroll:true});}catch(e){inp.focus();}}}
function clueMarkup(clue,def,hl){
  const loc=def&&clue.toLowerCase().includes(def.toLowerCase());
  if(!hl||!loc)return esc(clue);
  const i=clue.toLowerCase().indexOf(def.toLowerCase());
  return esc(clue.slice(0,i))+'<span class="hl">'+esc(clue.slice(i,i+def.length))+'</span>'+esc(clue.slice(i+def.length));
}
function populateCard(){
  const c=E.current;if(!c)return;
  const wrap=$("#devchipwrap");
  if(P.deck==="learn"){wrap.innerHTML='<button class="devchip dash" id="peekbtn">peek device</button>';$("#peekbtn").onclick=doPeek;}
  else wrap.innerHTML='<span class="devchip">real clue</span>';
  $("#cluetext").innerHTML=clueMarkup(c.clue,c.def||"",false);
  const inp=$("#panswer");if(inp){inp.value="";inp.classList.remove("bad");}
  E.inputVal="";
  const m=$("#pmsg");if(m){m.textContent="";m.className="msg-inline";}
  const loc=!!(c.def&&c.clue.toLowerCase().includes((c.def||"").toLowerCase()));
  $("#hintbtn").style.display=loc?"":"none";
  $("#preveal").hidden=false;$("#revealed").hidden=true;$("#nextbar").hidden=true;
  updateFoot();
  refocus();
}
function showRevealed(){
  const c=E.current;
  if(P.deck==="learn"){const d=DEVICES[c.device];$("#devchipwrap").innerHTML='<span class="devchip">'+esc(d.name)+'</span><span class="devblurb">'+esc(d.blurb)+'</span>';}
  $("#cluetext").innerHTML=clueMarkup(c.clue,c.def||"",true);
  $("#answercells").innerHTML=cellsHTML(c.answer);
  $("#defntext").textContent=c.def||"\u2014";
  $("#detail").innerHTML=P.deck==="learn"
    ?'<div class="lbl">Wordplay</div><div class="parse">'+esc(c.parse).replace(/\n/g,"<br>")+'</div>'
    :'<div class="lbl">Source</div><div class="src">'+esc(c.source||"imported")+'</div>';
  const g=E.check==="correct"?((E.peeked||E.defHint)?"partial":"clean"):"missed";
  const gt=g==="clean"?"Cracked it":g==="partial"?("Needed a nudge \u00b7 "+(E.peeked&&!E.defHint?"device peeked":E.defHint&&!E.peeked?"definition shown":"hint used")):"Missed it \u00b7 revealed";
  const badge=$("#gradebadge");badge.className="badge "+g;badge.textContent=gt;
  $("#preveal").hidden=true;$("#revealed").hidden=false;$("#nextbar").hidden=false;
}
function doCheck(){
  const inp=$("#panswer");const val=inp?inp.value:"";E.inputVal=val;if(!val.trim())return;
  if(norm(val)===norm(E.current.answer)){E.check="correct";E.revealed=true;showRevealed();}
  else{E.check="wrong";const m=$("#pmsg");if(m){m.textContent="\u2715 not quite \u2014 try again, or reveal";m.className="msg-inline bad";}if(inp){inp.classList.add("bad");inp.focus();}}
}
function doReveal(){E.revealed=true;if(E.check!=="correct")E.check="wrong";showRevealed();}
function doHint(){E.defHint=true;$("#cluetext").innerHTML=clueMarkup(E.current.clue,E.current.def||"",true);$("#hintbtn").style.display="none";refocus();}
function doPeek(){E.peeked=true;const d=DEVICES[E.current.device];$("#devchipwrap").innerHTML='<span class="devchip">'+esc(d.name)+'</span><span class="devblurb">'+esc(d.blurb)+'</span>';refocus();}
function nextCard(){
  const g=E.check==="correct"?((E.peeked||E.defHint)?"partial":"clean"):"missed";
  if(P.deck==="learn")recordLearn(E.current,g);else recordAssorted(E.current,g);
  E.session[g]++;fresh();
}
function updateFoot(){
  const f=$("#foot");if(!f)return;
  f.innerHTML='<span class="em">\u2713 '+E.session.clean+'</span><span class="am">\u2013 '+E.session.partial+'</span><span class="ro">\u2715 '+E.session.missed+'</span><span class="muted">this session</span><button class="linkbtn" id="skipbtn">skip \u203a</button>';
  const s=$("#skipbtn");if(s)s.onclick=()=>fresh();
}

    '<div id="importmsg" class="msg"></div></div>';
}
function wireImport(){
  const fi=$("#fileinput");if(!fi)return;
  $("#loadfilebtn").onclick=()=>fi.click();
  fi.onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{ingest(parseImport(String(rd.result)),f.name);}catch(err){importMsg("err","Couldn\u2019t read that file.");}};
    rd.onerror=()=>importMsg("err","Couldn\u2019t read that file.");rd.readAsText(f);fi.value="";};
  $("#importpaste").onclick=()=>{const t=$("#pastebox").value;const parsed=parseImport(t);if(parsed.length)$("#pastebox").value="";ingest(parsed,"");};
  $("#addone").onclick=()=>{const c=$("#one-clue").value.trim(),a=$("#one-ans").value.trim(),d=$("#one-def").value.trim();
    if(!c||!a){importMsg("err","A clue and an answer are both required.");return;}
    imported.push({id:"u"+Date.now(),clue:c,answer:a,def:d,source:"imported"});persistImported();
    $("#one-clue").value="";$("#one-ans").value="";$("#one-def").value="";importMsg("ok","Clue added.");updateAssortedCount();};
  if($("#clearimp"))$("#clearimp").onclick=()=>{imported=[];persistImported();P.showImport=true;renderPractice();};
}
function ingest(parsed,label){
  if(!parsed.length){importMsg("err","Couldn\u2019t find any clue/answer pairs. Use JSON (an array of clue/answer/definition) or CSV with those columns.");return;}
  const existing=new Set(assortedPool().map(c=>norm(c.clue)+"|"+norm(c.answer)));
  const now=Date.now();let added=0,dupes=0;
  parsed.forEach((p,i)=>{const k=norm(p.clue)+"|"+norm(p.answer);if(existing.has(k)){dupes++;return;}existing.add(k);
    imported.push({id:"u"+now+"_"+i,clue:p.clue,answer:p.answer,def:p.def||"",source:"imported"});added++;});
  persistImported();
  importMsg("ok","Added "+added+" clue"+(added===1?"":"s")+(label?(" from "+label):"")+(dupes?(" ("+dupes+" duplicate"+(dupes===1?"":"s")+" skipped)"):"")+".");
  updateAssortedCount();
}
function importMsg(kind,text){const m=$("#importmsg");if(m){m.textContent=text;m.className="msg "+kind;}}
function updateAssortedCount(){const b=$("#deck-assorted");if(b)b.textContent="Assorted \u00b7 "+assortedPool().length;const ci=$("#clearimp");if(ci)ci.textContent="clear "+imported.length+" imported";}

const indItems=()=>I.cat==="all"?INDICATORS:INDICATORS.filter(x=>x.cat===I.cat);
function renderIndLearn(){
  $("#indbody").innerHTML='<div class="indgrid">'+indItems().map(it=>
    '<div class="indcard"><div class="indtop"><span class="indterm">'+esc(it.t)+'</span>'+(known[it.t]==="known"?'<span class="ok">\u2713</span>':"")+'</div>'+
    '<div class="indmean">'+esc(it.m)+'</div>'+(it.n?'<div class="indnote">'+esc(it.n)+'</div>':"")+'</div>').join("")+'</div>';
}
function pickInd(prev){
  const items=indItems();const w=it=>{const k=known[it.t];return k==="known"?0.25:k==="learning"?1.6:1.0;};
  const cands=items.filter(x=>x.t!==prev);const list=cands.length?cands:items;
  const tot=list.reduce((s,x)=>s+w(x),0);let r=Math.random()*tot;
  for(const x of list){r-=w(x);if(r<=0)return x;}return list[list.length-1];
}
function drillFace(it){
  const flip=(it.cat==="letter"||it.cat==="short"||it.cat==="sneaky");
  return flip?{prompt:it.m,label:"What signals this?",answer:it.t}:{prompt:it.t,label:"What does this signal?",answer:it.m};
}
function renderIndDrill(){

  const c=I.dcur;const f=drillFace(c);
  $("#indbody").innerHTML='<div class="card"><div class="drill"><div class="lbl center">'+f.label+'</div>'+
    '<div class="drillterm">'+esc(f.prompt)+'</div>'+
    (I.drev?'<div class="drillrev"><div class="drillans">'+esc(f.answer)+'</div><div class="indnote"><b>'+esc(c.t)+'</b> \u2014 '+esc(c.m)+(c.n?'. '+esc(c.n):"")+'</div></div>':"")+'</div>'+
    (I.drev?'<div class="row gap2 pad" style="justify-content:stretch"><button class="btn btn-em big" id="know" style="flex:1;justify-content:center">\u2713 Know it</button><button class="btn btn-am big" id="learn" style="flex:1;justify-content:center">\u21bb Still learning</button></div>'
           :'<div class="row center pad"><button class="btn btn-dark big" id="drev">Reveal</button></div>')+'</div>'+
    '<div class="muted sm center" style="margin-top:16px">Drilling '+(I.cat==="all"?"all signals":esc(IND_CATS[I.cat]))+'. \u201cStill learning\u201d returns more often.</div>';
  if(I.drev){$("#know").onclick=()=>markInd("known");$("#learn").onclick=()=>markInd("learning");}
  else $("#drev").onclick=()=>{I.drev=true;renderIndDrill();};
}
function markInd(s){known[I.dcur.t]=s;persistKnown();I.dcur=pickInd(I.dcur.t);I.drev=false;renderIndDrill();}

/* ============ progress ============ */
function renderProgress(){
  const rows=DEVICE_ORDER.map(d=>{const s=stats.devices[d]||{clean:0,seen:0};return{d:d,name:DEVICES[d].name,seen:s.seen,rate:s.seen?Math.round(s.clean/s.seen*100):null};});
  const played=rows.filter(r=>r.seen>0);
  const totalSeen=played.reduce((a,r)=>a+r.seen,0);
  const ranked=played.filter(r=>r.seen>=3).slice().sort((a,b)=>b.rate-a.rate);
  const strengths=ranked.slice(0,2);const weak=ranked.slice(-2).reverse().filter(r=>strengths.indexOf(r)<0);
  const kc=Object.keys(known).filter(x=>known[x]==="known").length;
  const a=stats.assorted||{clean:0,seen:0};
  if(totalSeen===0&&a.seen===0){$("#view").innerHTML='<div class="empty">No attempts yet. Solve a few clues in Practice and your accuracy by device shows up here.</div>';return;}
  const color=r=>r>=70?"var(--teal)":r>=40?"var(--am)":"var(--ro)";
  let h='<div class="row gap wrap mb2 stats"><span><b>'+totalSeen+'</b> guided attempts</span><span><b>'+kc+'</b> indicators mastered</span>'+
    (a.seen?'<span><b>'+Math.round(a.clean/a.seen*100)+'%</b> clean on '+a.seen+' assorted</span>':"")+'</div>';
  if(played.length){
    h+='<div class="panel"><div class="lbl">Clean-solve rate by device (guided)</div>';
    h+=played.map(r=>'<div class="bar-row"><span class="bar-lbl">'+esc(r.name)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+r.rate+'%;background:'+color(r.rate)+'"></span></span><span class="bar-val">'+r.rate+'%</span></div>').join("");
    h+='</div>';
  }
  if(ranked.length){
    h+='<div class="row gap2 wrap mb2" style="align-items:stretch">'+
      '<div class="panel grow"><div class="lbl em">Your strengths</div>'+strengths.map(r=>'<div class="serif">'+esc(r.name)+' <span class="muted sm">\u00b7 '+r.rate+'% clean</span></div>').join("")+'</div>'+
      '<div class="panel grow"><div class="lbl ro">Work on these</div>'+(weak.length?weak.map(r=>'<div class="serif">'+esc(r.name)+' <span class="muted sm">\u00b7 '+r.rate+'% clean</span></div>').join(""):'<div class="muted sm">Need 3+ of another device.</div>')+'</div></div>';
  }
  h+='<button class="btn btn-x" id="reset">reset all progress</button>';
  $("#view").innerHTML=h;
  $("#reset").onclick=()=>{if(confirm("Reset all progress and mastered indicators?")){stats={devices:{},items:{},assorted:{clean:0,partial:0,missed:0,seen:0},assortedItems:{}};known={};persistStats();persistKnown();renderProgress();}};
}

/* ============ boot ============ */
try{localStorage.setItem("crib_probe","1");localStorage.removeItem("crib_probe");}catch(e){storageOK=false;}
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
render();
</script>
</body>
</html>
